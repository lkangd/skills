events {}

http {
  upstream api {
    server api-1:3000;
    server api-2:3000;
    server api-3:3000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    location / {
      root /srv/web;
      try_files $uri /index.html;
    }
  }
}
