name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://ledgerly:ledgerly@localhost:5432/ledgerly
      - run: npm test
        env:
          DATABASE_URL: postgres://ledgerly:ledgerly@localhost:5432/ledgerly
          JWT_SECRET: test-secret-test-secret
          PAYMENT_WEBHOOK_SECRET: whsec_test
          NODE_ENV: test

  migrate:
    # Runs before the rolling deploy; see docs/ops-runbook.txt
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
